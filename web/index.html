<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>decision systems tester</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --dim: #8b949e; --accent: #2f81f7; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "SF Pro Text", Menlo, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 240px 1fr 1fr; gap: 0; height: calc(100vh - 53px); }
  .col { overflow-y: auto; padding: 16px; }
  .col + .col { border-left: 1px solid var(--border); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 10px; }
  .scenario {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font: inherit;
  }
  .scenario:hover { border-color: var(--accent); }
  .scenario.active { border-color: var(--accent); background: rgba(47,129,247,.12); }
  .scenario .id { font-weight: 600; }
  .scenario .q { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.action {
    background: var(--accent); border: none; color: #fff; border-radius: 6px;
    padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.action.secondary { background: none; border: 1px solid var(--border); color: var(--text); font-weight: 400; }
  button.action.secondary:hover { border-color: var(--accent); }
  button.tiny { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  button.tiny:hover { color: var(--bad); }
  label { display: block; color: var(--dim); font-size: 12px; margin: 12px 0 4px; }
  input, textarea, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 9px; font: inherit;
  }
  textarea { resize: vertical; min-height: 84px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .opt-row { display: grid; grid-template-columns: 38px 110px 1fr 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .opt-row .letter { color: var(--accent); font-weight: 700; text-align: center; }
  .opt-row .del { text-align: right; }
  .toolbar { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .bars { margin-top: 14px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 130px; gap: 10px; align-items: center; margin-bottom: 8px; }
  .bar-row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { background: #21262d; border-radius: 4px; height: 22px; position: relative; }
  .bar-fill { background: var(--dim); height: 100%; border-radius: 4px; min-width: 2px; }
  .bar-row.win .bar-fill { background: var(--accent); }
  .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  .bar-row.win .val { color: var(--text); font-weight: 700; }
  .meta { display: flex; gap: 18px; margin-top: 12px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; }
  .argmax-badge { display: inline-block; background: rgba(63,185,80,.15); color: var(--ok); border: 1px solid var(--ok); border-radius: 10px; padding: 1px 10px; font-size: 12px; font-weight: 700; margin-top: 10px; }
  .err { color: var(--bad); margin-top: 10px; white-space: pre-wrap; }
  pre.raw { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow-x: auto; font-size: 12px; color: var(--dim); margin-top: 12px; }
  .hint { color: var(--dim); font-size: 12px; }
  .badge { font-size: 11px; color: var(--dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; margin-left: 6px; }
  .laya-chip { margin-left: auto; font-size: 11px; color: var(--dim); border: 1px solid var(--border); border-radius: 10px; padding: 2px 10px; white-space: nowrap; }
  .laya-chip.ready { color: var(--ok); border-color: var(--ok); }
  .laya-chip.error { color: var(--bad); border-color: var(--bad); }
  @keyframes spin { to { transform: rotate(360deg); } }
  table.cmp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.cmp th { color: var(--dim); font-size: 11px; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .05em; vertical-align: top; }
  table.cmp th .col-win { color: var(--ok); font-size: 13px; text-transform: none; font-weight: 700; margin-top: 2px; }
  table.cmp td { padding: 6px 8px; border-bottom: 1px solid #21262d; }
  table.cmp td.win { color: var(--text); font-weight: 700; }
  table.cmp .hint, table.cmp tr.hint td { color: var(--dim); font-size: 12px; font-weight: 400; }
  .batch-row { display: grid; grid-template-columns: 120px repeat(7, 1fr); gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .batch-row .b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .batch-row .cell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .batch-row .cell.win { color: var(--ok); font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>decision systems tester</h1>
  <span class="sub"><span id="model">…</span></span>
  <span class="laya-chip" id="layaChip">laya: loading…</span>
</header>
<main>
  <div class="col">
    <h2>Scenarios</h2>
    <div id="scenarioList"></div>
    <button class="action secondary" id="addScenario">+ New scenario</button>
  </div>
  <div class="col">
    <h2>Scenario editor</h2>
    <label>id</label>
    <input id="editId" placeholder="my-decision">
    <label>state (evidence — text, JSON object, or array)</label>
    <textarea id="editState" placeholder="The deployment completed at 14:02 UTC. …"></textarea>
    <label>question (criterion)</label>
    <input id="editQuestion" placeholder="Which option is correct?">
    <label>options (2–16)</label>
    <div id="editOptions"></div>
    <button class="action secondary" id="addOption">+ Add option</button>
    <div class="toolbar">
      <button class="action" id="scoreOne">Score this</button>
      <button class="action secondary" id="scoreAll">Score all scenarios</button>
    </div>
    <p class="hint" style="margin-top:14px">Probabilities are conditional on the supplied options and uncalibrated as confidence.</p>
  </div>
  <div class="col">
    <h2>Result</h2>
    <div id="result"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let scenarios = [];
let current = 0;
let nextId = 1;

function freshRow() {
  return {
    id: "scenario-" + nextId++,
    state: "",
    question: "",
    options: [
      { id: "opt_a", description: "" },
      { id: "opt_b", description: "" },
    ],
  };
}

function loadRow(row) {
  $("editId").value = row.id;
  $("editState").value = typeof row.state === "string" ? row.state : JSON.stringify(row.state, null, 2);
  $("editQuestion").value = row.question;
  renderOptions(row.options);
}

function renderOptions(options) {
  const wrap = $("editOptions");
  wrap.innerHTML = "";
  const letters = "ABCDEFGHIJKLMNOP";
  options.forEach((opt, i) => {
    const row = document.createElement("div");
    row.className = "opt-row";
    row.innerHTML = `
      <span class="letter">${letters[i]}</span>
      <input class="opt-id" placeholder="id" value="">
      <input class="opt-desc" placeholder="description" value="">
      <span class="del"><button class="tiny" title="remove">✕</button></span>`;
    row.querySelector(".opt-id").value = opt.id;
    row.querySelector(".opt-desc").value = opt.description;
    row.querySelector(".opt-id").addEventListener("input", (e) => { options[i].id = e.target.value; });
    row.querySelector(".opt-desc").addEventListener("input", (e) => { options[i].description = e.target.value; });
    row.querySelector(".tiny").addEventListener("click", () => {
      if (options.length <= 2) return;
      options.splice(i, 1);
      renderOptions(options);
    });
    wrap.appendChild(row);
  });
}

function readEditor() {
  let state = $("editState").value;
  try {
    if (state.trim().startsWith("{") || state.trim().startsWith("[")) state = JSON.parse(state);
  } catch { /* plain text */ }
  const options = [];
  $("editOptions").querySelectorAll(".opt-row").forEach((row) => {
    options.push({ id: row.querySelector(".opt-id").value, description: row.querySelector(".opt-desc").value });
  });
  return { id: $("editId").value, state, question: $("editQuestion").value, options };
}

function renderScenarioList() {
  const wrap = $("scenarioList");
  wrap.innerHTML = "";
  scenarios.forEach((row, i) => {
    const btn = document.createElement("button");
    btn.className = "scenario" + (i === current ? " active" : "");
    btn.innerHTML = `<div class="id"></div><div class="q"></div>`;
    btn.querySelector(".id").textContent = row.id;
    btn.querySelector(".q").textContent = row.question;
    btn.addEventListener("click", () => { current = i; loadRow(row); renderScenarioList(); });
    wrap.appendChild(btn);
  });
}

const SYSTEM_NAMES = ["llm", "llm-per-option", "tfidf-cosine", "naive-bayes", "jaccard", "knn", "laya"];

function argmax(probabilities) { return probabilities.indexOf(Math.max(...probabilities)); }

function renderResult(results, scenarioId) {
  const el = $("result");
  if (!results) { el.innerHTML = '<span class="hint">Score a scenario to compare systems.</span>'; return; }
  const options = results["llm"]?.option_ids || Object.values(results).find(r => r.option_ids)?.option_ids || [];
  const headers = SYSTEM_NAMES.map(name => {
    const r = results[name];
    if (!r || r.error || !r.probabilities) return `<th>${name}<div class="col-win">error</div></th>`;
    return `<th>${name}<div class="col-win">${r.option_ids[argmax(r.probabilities)]}</div></th>`;
  }).join("");
  const rows = options.map((opt, i) => {
    const cells = SYSTEM_NAMES.map(name => {
      const r = results[name];
      if (!r || r.error) return `<td class="hint">—</td>`;
      const p = r.probabilities[i] ?? 0;
      return `<td class="${argmax(r.probabilities) === i ? "win" : ""}">${(p * 100).toFixed(1)}%</td>`;
    }).join("");
    return `<tr><td class="b">${opt}</td>${cells}</tr>`;
  }).join("");
  // agreement line: how many systems agree with the LLM choice
  const llm = results["llm"];
  const llmChoice = llm && !llm.error ? llm.option_ids[argmax(llm.probabilities)] : null;
  let agreement = "";
  if (llmChoice) {
    const agreeing = SYSTEM_NAMES.filter(name => {
      const r = results[name];
      return r && !r.error && r.option_ids[argmax(r.probabilities)] === llmChoice;
    }).length;
    const disagreeing = SYSTEM_NAMES.filter(name => {
      const r = results[name];
      return r && !r.error && r.option_ids[argmax(r.probabilities)] !== llmChoice;
    });
    agreement = `<div class="meta">systems agreeing with LLM choice <b>${llmChoice}</b>: <b>${agreeing}/${SYSTEM_NAMES.length}</b>${disagreeing.length ? ` · disagree: <b>${disagreeing.join(", ")}</b>` : ""}</div>`;
  }
  const errors = SYSTEM_NAMES.filter(name => results[name]?.error).map(name => `<div class="err">${name}: ${results[name].error}</div>`).join("");
  const meta = SYSTEM_NAMES.map(name => {
    const r = results[name];
    if (!r || r.error) return "";
    const conf = r.confidence != null ? ` · conf <b>${(r.confidence * 100).toFixed(1)}%</b>` : "";
    return `<span>${name} <b>${(r.total_seconds * 1000).toFixed(0)} ms</b>${conf}</span>`;
  }).join("");
  el.innerHTML = `
    <table class="cmp"><tr><th>option</th>${headers}</tr>${rows}</table>
    ${agreement}
    <div class="meta">${meta}</div>
    ${errors}
    <button class="action secondary" style="margin-top:12px" id="toggleRaw">raw JSON</button>
    <pre class="raw" id="rawJson" style="display:none"></pre>`;
  $("toggleRaw").addEventListener("click", () => {
    const pre = $("rawJson");
    pre.style.display = pre.style.display === "none" ? "block" : "none";
    pre.textContent = JSON.stringify(results, null, 2);
  });
}

async function score(row) {
  const resp = await fetch("/api/score", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(row) });
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.detail || resp.statusText);
  return body.results;
}

async function scoreOne() {
  const row = readEditor();
  const el = $("result");
  el.innerHTML = '<span class="spinner"></span>scoring all systems…';
  try {
    const results = await score(row);
    renderResult(results, row.id);
  } catch (e) {
    el.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

async function scoreAll() {
  const el = $("result");
  el.innerHTML = scenarios.map(row =>
    `<div class="batch-row"><span class="spinner"></span><span class="b">${row.id}</span>` +
    SYSTEM_NAMES.map(() => `<span class="cell hint">…</span>`).join("") + `</div>`
  ).join("");
  for (let i = 0; i < scenarios.length; i++) {
    const row = scenarios[i];
    const line = el.children[i];
    try {
      const r = await score(row);
      const cells = SYSTEM_NAMES.map(name => {
        const sys = r[name];
        if (!sys || sys.error) return `<span class="cell hint">error</span>`;
        const win = argmax(sys.probabilities);
        return `<span class="cell win">${sys.option_ids[win]} ${(sys.probabilities[win] * 100).toFixed(0)}%</span>`;
      }).join("");
      line.innerHTML = `<span class="b">${row.id}</span>` + cells;
    } catch (e) {
      line.innerHTML = `<span class="b">${row.id}</span><span class="cell hint" style="grid-column: 2 / -1">error: ${e.message}</span>`;
    }
  }
}

function syncFromEditor() {
  const row = readEditor();
  scenarios[current] = row;
  renderScenarioList();
}

$("editId").addEventListener("input", syncFromEditor);
$("editQuestion").addEventListener("input", syncFromEditor);
$("addOption").addEventListener("click", () => {
  const row = readEditor();
  if (row.options.length >= 16) return;
  row.options.push({ id: "opt_" + String.fromCharCode(97 + row.options.length % 26), description: "" });
  scenarios[current] = row;
  renderOptions(row.options);
  renderScenarioList();
});
$("addScenario").addEventListener("click", () => {
  scenarios.push(freshRow());
  current = scenarios.length - 1;
  loadRow(scenarios[current]);
  renderScenarioList();
});
$("scoreOne").addEventListener("click", scoreOne);
$("scoreAll").addEventListener("click", scoreAll);

(async () => {
  try {
    const resp = await fetch("/api/examples");
    scenarios = await resp.json();
    current = 0;
  } catch {
    scenarios = [freshRow()];
  }
  loadRow(scenarios[0]);
  renderScenarioList();
  renderResult(null);
  fetch("/api/info").then(r => r.json()).then(d => { $("model").textContent = d.model; }).catch(() => {});
  // laya status chip: poll until ready/error (the model is a one-time multi-minute load)
  (function pollLaya() {
    fetch("/api/laya").then(r => r.json()).then(d => {
      const chip = $("layaChip");
      if (d.status === "ready") {
        chip.textContent = "laya: ready"; chip.className = "laya-chip ready";
      } else if (d.status === "error") {
        chip.textContent = "laya: " + (d.error || "error"); chip.className = "laya-chip error";
      } else {
        chip.textContent = "laya: loading…";
        setTimeout(pollLaya, 5000);
      }
    }).catch(() => setTimeout(pollLaya, 5000));
  })();
})();
</script>
</body>
</html>
